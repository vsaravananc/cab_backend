[project]
name = "uber-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Saravanan v", email = "v.saravanan.c@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.162.2",
    "ruff>=0.17.4",
    "sqlmodel>=0.0.48",
]

[tool.fastapi]
entrypoint="src.uber_backend.main:app"

[tool.ruff]
line-length = 80

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
